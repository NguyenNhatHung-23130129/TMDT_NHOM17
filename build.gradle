task docker_db_start {

    doLast {

        println '=== Starting MySQL ==='

        ssh.run {
            session(remotes.host) {

                execute 'docker start mysql', ignoreError: true

            }
        }
    }
}
task docker_restart_tomcat {
    doLast {
        ssh.run {
            session(remotes.host) {
                execute 'touch /usr/deploy/ROOT.war'
            }
        }
    }
}

task docker_upload_file_to_server {

    dependsOn war

    doLast {

        println '=== Uploading ROOT.war ==='

        ssh.run {
            session(remotes.host) {

                execute 'mkdir -p /usr/deploy'

                execute 'rm -rf /usr/deploy/ROOT', ignoreError: true

                put from: "${buildDir}/libs/ROOT.war",
                        into: "/usr/deploy/ROOT.war"
            }
        }
    }
}

task docker_app_start {
    doLast {
        println 'Khởi động Tomcat 10...'
        ssh.run {
            session(remotes.host) {
                execute 'docker rm -f tomcat10', ignoreError: true
                execute 'docker run -d ' +
                        '--name tomcat10 ' +
                        '--network mynetwork ' +
                        '-v /usr/deploy:/usr/local/tomcat/webapps ' +
                        '-p 80:8080 ' +
                        'tomcat:10.1'
            }
        }
    }
}

task docker_deploy {
    dependsOn build
    dependsOn docker_db_start
    dependsOn docker_upload_file_to_server
    dependsOn docker_app_start

    docker_db_start.mustRunAfter build
    docker_upload_file_to_server.mustRunAfter docker_db_start
    docker_app_start.mustRunAfter docker_upload_file_to_server
}

task deploy {


    dependsOn docker_upload_file_to_server
    dependsOn docker_restart_tomcat
    docker_restart_tomcat.mustRunAfter docker_upload_file_to_server
}
