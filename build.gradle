plugins {
    id 'java'
    id 'war'
    id 'maven-publish'
    id 'org.hidetake.ssh' version '2.11.2'
}

apply plugin: 'org.hidetake.ssh'

group = 'vn.edu.hcmuaf.fit'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
war {
    archiveFileName = 'ROOT.war'
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {

    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:3.1.3'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.3'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.3'

    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    implementation 'org.jdbi:jdbi3-core:3.50.0'
    implementation 'com.mysql:mysql-connector-j:9.5.0'

    implementation 'com.google.firebase:firebase-admin:9.2.0'
    implementation 'com.cloudinary:cloudinary-http44:1.39.0'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'com.sun.mail:javax.mail:1.6.2'

    implementation 'org.json:json:20240303'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'

    implementation 'commons-validator:commons-validator:1.9.0'


}

test {
    useJUnitPlatform()
}

remotes {
    host {
        host = '192.168.33.231'
        user = 'root'
        password = '12345678'
    }
}

ssh.settings {
    knownHosts = allowAnyHosts
}

